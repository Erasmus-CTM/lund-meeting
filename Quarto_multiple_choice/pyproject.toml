[project]
name = "ctm-things"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "gepa>=0.0.27",
    "ipykernel>=7.2.0",
    "mlflow[genai]>=3.9.0",
    "nbformat>=5.10.4",
    "openai>=2.20.0",
    "pandas>=2.3.3",
    "pip>=26.0.1",
    "plotly>=6.6.0",
    "polars>=1.38.1",
    "statsmodels>=0.14.6",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = ["INP", "D", "T", "S", "ERA", "RUF001", "PLR", "FBT", "BLE001"]
